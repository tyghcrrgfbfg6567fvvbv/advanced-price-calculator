<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Price & Quantity Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="call.css">
</head>
<body>
  <div class="calculator-container">
    <h1>Price & Quantity Calculator</h1>
    <form id="calculator-form">
      <!-- Weight Section -->
      <div class="form-group">
        <label for="weight">Weight:</label>
        <div class="input-group">
          <input type="number" id="weight" placeholder="Enter weight" step="0.01" required>
          <div class="custom-select" id="weight-unit">
            <div class="select-trigger" tabindex="0">kg</div>
            <ul class="select-options">
              <li data-value="kg">kg</li>
              <li data-value="grams">g</li>
            </ul>
          </div>
        </div>
      </div>

      <!-- Price Section -->
      <div class="form-group">
        <label for="price">Price (₹):</label>
        <input type="number" id="price" placeholder="Enter price (₹)" step="0.01" required>
      </div>

      <!-- Calculation Type -->
      <div class="form-group">
        <label for="calculation-type">Select Calculation:</label>
        <div class="custom-select" id="calculation-type">
          <div class="select-trigger" tabindex="0">Calculate Price (₹)</div>
          <ul class="select-options">
            <li data-value="price-per-quantity">Calculate Price (₹)</li>
            <li data-value="quantity-per-price">Calculate Weight</li>
          </ul>
        </div>
      </div>

      <!-- Input Value Section -->
      <div class="form-group">
        <label for="input-value">Enter Value:</label>
        <div class="input-group">
          <input type="number" id="input-value" placeholder="Enter value" step="0.01" required>
          <div class="custom-select" id="input-unit">
            <div class="select-trigger" tabindex="0">kg</div>
            <ul class="select-options">
              <li data-value="kg">kg</li>
              <li data-value="grams">g</li>
              <li data-value="price">₹</li>
            </ul>
          </div>
        </div>
      </div>

      <!-- Calculate Button -->
      <button type="button" id="calculate-button">Calculate</button>
    </form>

    <!-- Output Section -->
    <div id="result" class="result-box"></div>
  </div>
  <script src="call.js"></script>
</body>
                                                           </html>
